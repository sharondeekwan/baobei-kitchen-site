<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaoBei Kitchen — A recipe was shared with you</title>

    <!-- Open Graph (iMessage / Mail / Slack Link Preview) -->
    <meta property="og:title" content="A recipe shared via BaoBei Kitchen">
    <meta property="og:description" content="Download BaoBei Kitchen to open this recipe.">
    <meta property="og:image" content="https://kitchen.baobeilabs.com/dumpling-mascots.png">
    <meta property="og:type" content="website">

    <!-- Twitter card (some clients fall back to this) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="A recipe shared via BaoBei Kitchen">
    <meta name="twitter:description" content="Download BaoBei Kitchen to open this recipe.">
    <meta name="twitter:image" content="https://kitchen.baobeilabs.com/dumpling-mascots.png">

    <!-- Apple Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=6762439274">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: #463728;
            line-height: 1.55;
            background: linear-gradient(180deg, #E3F4E0 0%, #F5FBF4 60%, #FAFDF9 100%);
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 56px 28px 48px;
            text-align: center;
        }
        .mascots {
            width: 100%;
            max-width: 360px;
            height: auto;
            margin: 0 auto 28px;
            display: block;
        }
        h1 {
            font-size: 1.7rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: #463728;
            letter-spacing: -0.01em;
        }
        .lede {
            font-size: 1.05rem;
            color: #6B5A47;
            margin-bottom: 32px;
        }
        .cta {
            display: inline-block;
            background: #463728;
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 14px;
            text-decoration: none;
            letter-spacing: 0.01em;
            min-height: 44px;
            line-height: 1.1;
        }
        .cta:focus-visible {
            outline: 3px solid #6B8E78;
            outline-offset: 3px;
        }
        /* The copied state replaces the button in place: same box, so the
           page does not reflow under the thumb that just tapped it. */
        .copied {
            display: inline-block;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px 28px;
            border-radius: 14px;
            min-height: 44px;
            line-height: 1.1;
            background: #E3F0E4;
            color: #3F6B4A;
            border: 1px solid #BFD9C4;
        }
        .hint {
            font-size: 0.95rem;
            color: #6B5A47;
            margin-top: 14px;
        }
        .going {
            font-size: 0.95rem;
            color: #8A7B68;
            margin-top: 10px;
        }
        /* iOS-only line pinned to the bottom of the screen rather than
           floating under the content. */
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; }
        .container { flex: 1 0 auto; }
        .ios-note {
            flex-shrink: 0;
            text-align: center;
            font-size: 0.85rem;
            color: #8A7B68;
            padding: 0 28px 24px;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #8A7B68;
        }
        @media (max-width: 380px) {
            .container { padding: 40px 20px; }
            h1 { font-size: 1.45rem; }
            .lede { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <img src="/dumpling-mascots.png"
             alt="Two dumpling mascots: a chef dumpling wearing a hat next to a smaller baby dumpling"
             class="mascots">

        <h1>A recipe is shared with you!</h1>
        <p class="lede">
            Tap below to copy the recipe and get the app. Then open BaoBei Kitchen and tap <strong>Paste</strong> to see it.
        </p>

        <a class="cta" id="cta" href="https://apps.apple.com/app/id6762439274"
           data-store="https://apps.apple.com/app/id6762439274"
           data-copied="Recipe copied" rel="noopener">
            Copy recipe &amp; get the app
        </a>

        <p class="hint">Already have the app? Tap the recipe link again.</p>
    </main>
    <p class="ios-note">BaoBei Kitchen is iOS only.</p>
    <script>
        // The hand-off: copy the link the person is standing on, then send
        // them to the App Store. iOS has no deferred deep link, so the
        // clipboard is what carries the invite across the install — the app
        // offers a system Paste button on first launch.
        //
        // If the clipboard write throws (an old browser, a denied permission,
        // a non-secure context) we navigate immediately and the "tap the link
        // again" line above still covers them.
        (function () {
            var btn = document.getElementById('cta');
            var store = btn.getAttribute('data-store');
            btn.addEventListener('click', function (event) {
                event.preventDefault();
                var go = function () { window.location.href = store; };
                try {
                    navigator.clipboard.writeText(window.location.href).then(function () {
                        var copied = document.createElement('span');
                        copied.className = 'copied';
                        copied.textContent = '\u2713 ' + btn.getAttribute('data-copied');
                        btn.replaceWith(copied);
                        var going = document.createElement('p');
                        going.className = 'going';
                        going.textContent = 'Opening the App Store\u2026';
                        copied.insertAdjacentElement('afterend', going);
                        setTimeout(go, 900);
                    }, go);
                } catch (e) {
                    go();
                }
            });
        })();
    </script>
</body>
</html>
